<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cassette Deck</title>
<style>
:root{--w2:#4a2f1c;--br:#c9a45c;--cr:#efe3c5;--am:#ffb347}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;color:var(--cr);font:14px/1.3 "Courier New",monospace;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(ellipse at 50% 0,#4a2f1c,#1a0f08 75%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--am);outline-offset:2px}
#shelf{position:fixed;inset:0;overflow:auto;padding:18px 16px 280px;transition:opacity .5s,transform .6s}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
h1{font:700 24px Georgia,serif;color:var(--am);text-shadow:0 0 14px #ffb34766}
header button{padding:8px 12px;border:1px solid var(--br);border-radius:6px;color:var(--br);margin-left:6px}
.rm #rm{background:var(--br);color:#2a1a10}
.rm .tape .lab{box-shadow:0 0 0 .3em #d1432f}
.empty{opacity:.7;padding:40px 4px;max-width:30em}
h2{font:italic 16px Georgia,serif;opacity:.75;margin:18px 0 2px}
.row{display:flex;gap:22px;padding:26px 18px 18px;overflow-x:auto;perspective:900px;border-bottom:12px solid var(--w2);background:linear-gradient(#0000 70%,#0005)}
/* 3D cassette: sized in em so it scales anywhere */
.t3{position:relative;width:20em;height:12.8em;transform-style:preserve-3d}
.t3>*{position:absolute}
.cas,.bk{inset:0;border-radius:.9em;background:linear-gradient(150deg,var(--a),var(--b));backface-visibility:hidden}
.cas{transform:translateZ(.6em);box-shadow:inset 0 0 0 .15em #fff3,inset 0 -.8em 1.4em #0008}
.cas::before{content:"";position:absolute;left:.6em;top:.6em;width:.7em;height:.7em;border-radius:50%;background:#aaa;box-shadow:18.1em 0 #aaa,0 10.9em #aaa,18.1em 10.9em #aaa}
.bk{transform:rotateY(180deg) translateZ(.6em)}
.ed{background:#120d09;top:0;width:1.2em;height:100%}
.ed.l{left:-.6em;transform:rotateY(-90deg)}.ed.r{right:-.6em;transform:rotateY(90deg)}
.ed.t,.ed.d{left:0;width:100%;height:1.2em}
.ed.t{top:-.6em;transform:rotateX(90deg)}.ed.d{top:auto;bottom:-.6em;transform:rotateX(-90deg)}
.lab{position:absolute;left:7%;right:7%;top:9%;height:48%;background:var(--cr);border-radius:.5em;color:#2a1a10;padding:2.9em .8em 0;overflow:hidden}
.lab::before{content:"";position:absolute;inset:0 0 auto;height:2.2em;background:var(--s)}
.lab b{display:block;font:700 1.5em/1.1 "Segoe Print","Bradley Hand","Comic Sans MS",cursive;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78%}
.lab small{display:block;font-size:1.05em;opacity:.65;margin-top:.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78%}
.lab img{position:absolute;right:.6em;bottom:.6em;width:3.8em;height:3.8em;border-radius:.3em;object-fit:cover}
.win{position:absolute;left:27%;right:27%;top:61%;height:24%;background:#0b0907;border-radius:2em;border:.15em solid #fff3;display:flex;justify-content:space-between;align-items:center;padding:0 .5em}
.reel{width:2.7em;height:2.7em;border-radius:50%;border:.25em solid #5b4631;background:radial-gradient(circle,#0b0907 0 22%,#0000 23%),conic-gradient(#e8e2d0 0 10%,#2a231c 10% 33%,#e8e2d0 33% 43%,#2a231c 43% 66%,#e8e2d0 66% 76%,#2a231c 76%)}
.trap{position:absolute;left:20%;right:20%;bottom:0;height:14%;background:#0007;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.tape{flex:none;font-size:clamp(7px,2.4vw,11px);cursor:grab;margin-right:1em;transform:rotateY(-26deg);transition:transform .25s}
.tape:hover{transform:rotateY(-8deg) translateY(-8px)}
.tape.up{opacity:.2}
.ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;margin:0;transition:none!important}
/* deck */
#deck{position:fixed;left:0;right:0;bottom:0;z-index:5;font-size:clamp(8px,min(2.5vw,2.1vh),16px);display:flex;justify-content:center;align-items:center;gap:1.6em;padding:1.4em 1.4em calc(1.4em + env(safe-area-inset-bottom));background:linear-gradient(#cfc7b4,#8d8574 14%,#6f6858);border-top:.4em solid var(--br);box-shadow:0 -1em 2em #000a}
#bay{position:relative;width:21.6em;height:14em;perspective:60em;background:#0b0907;border-radius:.8em;box-shadow:inset 0 .4em 1.4em #000;display:grid;place-items:center;cursor:pointer;transition:box-shadow .2s}
#bay.hot{box-shadow:inset 0 .4em 1.4em #000,0 0 0 .3em var(--am)}
#slot{width:20em;height:12.8em;display:grid;place-items:center}
#slot:empty::before{content:"Drag a tape here";color:#7a6a55;font-size:1.3em}
#slot .t3{animation:ins .5s ease-out}
@keyframes ins{from{transform:translateY(-9em) scale(.9)}}
#lid{position:absolute;inset:0;border-radius:.8em;transform-origin:50% 0;transform:rotateX(-115deg);transition:transform .65s cubic-bezier(.34,1.3,.5,1);background:linear-gradient(120deg,#ffffff22,#0000 40%),#1c1814d9;border:.25em solid #3a342c;pointer-events:none}
.cl #lid{transform:none}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
.ctl button{width:2.5em;height:2.1em;font-size:2.1em;border-radius:.3em;background:linear-gradient(#e9e4d6,#a79f8c);color:#2a1a10;box-shadow:0 .15em 0 #4a4234,0 .3em .5em #0008;transition:transform .06s,box-shadow .06s}
.ctl button:active{transform:translateY(.12em);box-shadow:0 .03em 0 #4a4234}
.ctl [data-k=play]{background:linear-gradient(#e86a55,#a8301f);color:#fff}
.ctl [data-k=play]::before{content:"\25B6\FE0E"}
.pl .ctl [data-k=play]::before{content:"\23F8\FE0E"}
/* full-screen stage */
#stage{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;font-size:clamp(10px,2.6vw,18px);background:radial-gradient(ellipse at 50% 35%,#5a3a22,#150b05 80%);opacity:0;pointer-events:none;transition:opacity .6s;padding-bottom:env(safe-area-inset-bottom)}
.cl #stage{opacity:1;pointer-events:auto}
.cl #shelf{opacity:0;transform:scale(.96);pointer-events:none}
#sv{perspective:80em;touch-action:none;cursor:grab}
#bigt{font-size:min(4.4vw,4.6vh);transition:transform .15s ease-out}
.cl #bigt{animation:zoom .9s cubic-bezier(.2,.9,.3,1)}
@keyframes zoom{from{scale:.3;opacity:.3}}
#lcd{display:flex;justify-content:space-between;gap:1em;width:min(92vw,520px);padding:.5em .9em;font:700 1.5em/1.2 "Courier New",monospace;color:var(--am);background:#1a0f05;border:.15em solid #000;border-radius:.4em;text-shadow:0 0 .5em #ffb34788;box-shadow:inset 0 0 1em #000}
#np{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#hint{opacity:.55;text-align:center;padding:0 16px}
.pl .reel{animation:sp 1.1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:40;max-width:90vw;padding:8px 14px;border-radius:20px;background:#000d;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#toast.s{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style></head><body>
<div id="shelf"><header><h1>Cassette Deck</h1><span><button id="add">Add tape</button><button id="rm">Remove</button></span><input id="pick" type="file" accept=".wav,audio/*" multiple hidden></header><div id="rows"></div></div>
<div id="deck"><div id="bay"><div id="slot"></div><div id="lid"></div></div></div>
<div id="stage"><div id="sv"><div class="t3" id="bigt"></div></div><div id="lcd"><span id="np">No tape loaded</span><span id="ct">00:00</span></div><p id="hint">Tap ⏏ to open the lid and go back to the shelf</p></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),D=document.body,S={item:null,on:false};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let tt;const toast=m=>{const e=$("#toast");e.textContent=m;e.classList.add("s");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("s"),2800)};
const info=(a,b)=>$("#np").textContent=b?a+" — "+b:a;
const esc=s=>String(s).replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
const hash=s=>[...s].reduce((h,c)=>h*31+c.charCodeAt(0)|0,7);
const PAL=[["#2d2a26","#14110e","#d1432f"],["#e8e1cf","#b3a78c","#2f5d8a"],["#2a3b2f","#121c15","#e0a13a"],["#5a2a2a","#2a1010","#3d7a6a"],["#27324a","#0f1626","#ffb347"],["#c9a45c","#7a5f2a","#8a2f2f"]];

/* ---------- sound: everything is synthesized, no audio files ---------- */
let C,NB,hiss;
const A=()=>C||(C=new(window.AudioContext||window.webkitAudioContext)());
const unlock=()=>{const c=A();if(c.state!=="running")c.resume()};
const noise=()=>NB||(NB=(()=>{const c=A(),b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b})());
function nz(dur,f,type,v,at=0,q=1){const c=A(),s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+at;s.buffer=noise();fl.type=type;fl.frequency.value=f;fl.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl).connect(g).connect(c.destination);s.start(t,Math.random(),dur+.05)}
function tn(f,dur,v,type="sine",at=0,f2){const c=A(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+at;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05)}
function loop(on){const c=A();if(on&&!hiss){const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),o=c.createOscillator(),og=c.createGain(),l=c.createOscillator(),lg=c.createGain(),t=c.currentTime;
s.buffer=noise();s.loop=true;f.type="highpass";f.frequency.value=4500;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+.4);s.connect(f).connect(g).connect(c.destination);
o.type="sawtooth";o.frequency.value=96;l.frequency.value=.7;lg.gain.value=2;l.connect(lg).connect(o.frequency);og.gain.setValueAtTime(0,t);og.gain.linearRampToValueAtTime(.008,t+.4);o.connect(og).connect(c.destination);
s.start();o.start();l.start();hiss=()=>{const u=c.currentTime;g.gain.linearRampToValueAtTime(0,u+.25);og.gain.linearRampToValueAtTime(0,u+.25);[s,o,l].forEach(n=>n.stop(u+.3))}}
else if(!on&&hiss){hiss();hiss=null}}
const sfx={
key(){tn(140,.09,.5,"triangle",0,60);nz(.03,2500,"highpass",.5)},
insert(){nz(.28,900,"bandpass",.35,0,2);tn(90,.18,.7,"sine",.24,45);nz(.04,3000,"highpass",.5,.24)},
lid(){nz(.1,3500,"highpass",.25,.1);tn(110,.28,.9,"sine",.38,40);nz(.12,600,"lowpass",.8,.38);nz(.03,4000,"highpass",.5,.42)},
open(){nz(.05,3500,"highpass",.4);tn(300,.12,.3,"square",0,150);nz(.5,500,"bandpass",.15,.05,3)},
start(){tn(70,.14,.6,"sine",0,38);nz(.05,2000,"highpass",.3);loop(true)},
stop(){loop(false);nz(.05,2000,"highpass",.3);tn(80,.1,.4,"sine",0,45)},
whirr(d){const c=A(),t=c.currentTime,o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type="sawtooth";f.type="lowpass";f.frequency.value=900;o.frequency.setValueAtTime(d>0?160:420,t);o.frequency.exponentialRampToValueAtTime(d>0?420:160,t+.6);g.gain.setValueAtTime(.06,t);g.gain.linearRampToValueAtTime(0,t+.65);o.connect(f).connect(g).connect(c.destination);o.start(t);o.stop(t+.7);nz(.5,2500,"bandpass",.12,0,2)}};

/* ---------- tape player: plays your own WAV files ---------- */
const au=new Audio();let url;
function track(i,play){const t=S.item.tracks[i];S.i=i;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(t.blob);au.src=url;info(S.item.name,(i+1)+"/"+S.item.tracks.length+" "+t.name);if(play)return au.play()}
au.onended=()=>{if(S.i<S.item.tracks.length-1)track(S.i+1,true).catch(()=>{});else{S.on=false;D.classList.remove("pl");sfx.stop();track(0)}};

/* ---------- cassettes + shelf ---------- */
function tape(it,cls){const p=PAL[Math.abs(hash(it.name))%PAL.length],e=document.createElement("div");
e.className="t3 "+(cls||"");e.style.cssText=`--a:${p[0]};--b:${p[1]};--s:${p[2]}`;
e.innerHTML=`<div class="cas"><div class="lab"><b>${esc(it.name)}</b><small>${esc(it.sub)}</small>${it.art?`<img src="${esc(it.art)}" alt="">`:""}</div><div class="win"><u class="reel"></u><u class="reel"></u></div><i class="trap"></i></div><div class="bk"></div><i class="ed l"></i><i class="ed r"></i><i class="ed t"></i><i class="ed d"></i>`;return e}
function shelf(title,items){if(!items.length)return;const h=document.createElement("h2"),r=document.createElement("div");h.textContent=title;r.className="row";
items.forEach(it=>{const t=tape(it,"tape");t.onpointerdown=e=>grab(e,it,t);r.append(t)});$("#rows").append(h,r)}

/* drag a tape into the deck (touch: press and hold; tap also inserts) */
const over=ev=>{const r=$("#bay").getBoundingClientRect();return ev.clientX>r.left-30&&ev.clientX<r.right+30&&ev.clientY>r.top-30&&ev.clientY<r.bottom+30};
let dragging=false;
document.addEventListener("touchmove",e=>{if(dragging)e.preventDefault()},{passive:false});
function grab(e,it,t){if(e.button>0)return;unlock();
const sx=e.clientX,sy=e.clientY,touch=e.pointerType==="touch";let on=false,g,timer;
const mv=(x,y)=>{g.style.transform=`translate(${x-g.offsetWidth/2}px,${y-g.offsetHeight/2}px) rotateY(-12deg)`};
const start=()=>{on=dragging=true;g=t.cloneNode(true);g.classList.add("ghost");D.append(g);t.classList.add("up");mv(sx,sy)};
const move=ev=>{const d=Math.hypot(ev.clientX-sx,ev.clientY-sy);
if(!on){if(touch){if(d>8)end(1)}else if(d>6)start()}
if(on){mv(ev.clientX,ev.clientY);$("#bay").classList.toggle("hot",over(ev))}};
const end=(cancel,ev)=>{clearTimeout(timer);removeEventListener("pointermove",move);removeEventListener("pointerup",up);removeEventListener("pointercancel",cx);
if(on){g.remove();t.classList.remove("up");$("#bay").classList.remove("hot");dragging=false;if(!cancel&&ev&&over(ev))load(it)}
else if(!cancel&&ev)D.classList.contains("rm")?drop(it):load(it)};
const up=ev=>end(0,ev),cx=()=>end(1);
if(touch)timer=setTimeout(start,260);
addEventListener("pointermove",move);addEventListener("pointerup",up);addEventListener("pointercancel",cx)}

/* ---------- deck logic ---------- */
async function load(it){unlock();pause(true);S.item=it;
$("#slot").replaceChildren(tape(it));const b=tape(it),big=$("#bigt");big.style.cssText=b.style.cssText;big.innerHTML=b.innerHTML;
sfx.insert();track(0);
toast("Tap the tape to close the lid")}
function lid(c){if(D.classList.contains("cl")===c)return;if(c&&!S.item)return toast("Drag a tape into the deck first");
if(!c)pause();D.classList.toggle("cl",c);c?sfx.lid():sfx.open()}
function pause(q){if(!S.on)return;S.on=false;D.classList.remove("pl");if(!q)sfx.stop();else loop(false);au.pause()}
async function toggle(){if(!S.item)return toast("Drag a tape into the deck first");if(S.on)return pause();
if(!D.classList.contains("cl")){lid(true);await wait(900)}
S.on=true;D.classList.add("pl");sfx.start();
try{await au.play()}catch(e){S.on=false;D.classList.remove("pl");sfx.stop();toast("Playback failed. Try adding the tape again.")}}
async function skip(d){if(!S.item)return;if(!S.on)return toast("Press play first");sfx.whirr(d);
const i=S.i+d;if(i>=S.item.tracks.length)return;try{await track(Math.max(0,i),true)}catch(e){}}
const B=[["rew","⏪\uFE0E","Previous track"],["play","","Play or pause"],["ff","⏩\uFE0E","Next track"],["eject","⏏\uFE0E","Open or close the lid"]];
function ctl(){const d=document.createElement("div");d.className="ctl";
B.forEach(([k,g,t])=>{const b=document.createElement("button");b.textContent=g;b.title=t;b.setAttribute("aria-label",t);b.dataset.k=k;
b.onpointerdown=()=>{unlock();sfx.key()};
b.onclick=()=>({rew:()=>skip(-1),play:toggle,ff:()=>skip(1),eject:()=>lid(!D.classList.contains("cl"))})[k]();d.append(b)});return d}
$("#deck").append(ctl());$("#stage").insertBefore(ctl(),$("#hint"));
$("#bay").onclick=()=>{if(S.item)lid(true)};
$("#stage").onpointermove=e=>{$("#bigt").style.transform=`rotateY(${(e.clientX/innerWidth-.5)*50}deg) rotateX(${-(e.clientY/innerHeight-.5)*34}deg)`};
const fmt=t=>{t=Math.max(0,t|0);return String(t/60|0).padStart(2,"0")+":"+String(t%60).padStart(2,"0")};
setInterval(()=>{$("#ct").textContent=fmt(au.currentTime||0)},500);

/* ---------- your library, saved in this browser (IndexedDB) ---------- */
const idb=new Promise((res,rej)=>{const r=indexedDB.open("cassettes",1);r.onupgradeneeded=()=>r.result.createObjectStore("tapes",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f)=>{const db=await idb;return new Promise((res,rej)=>{const t=db.transaction("tapes",m),q=f(t.objectStore("tapes"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
async function refresh(){let all=[];try{all=(await tx("readonly",s=>s.getAll()))||[]}catch(e){toast("Saved tapes aren’t available in this browser")}
all.sort((a,b)=>a.id-b.id);$("#rows").replaceChildren();
if(!all.length){$("#rows").innerHTML='<p class="empty">Your shelf is empty. Tap Add tape and choose your WAV files. They stay on this device.</p>';return}
shelf("Your tapes",all.map(t=>({...t,sub:t.tracks.length+(t.tracks.length>1?" tracks":" track"),art:""})))}
async function drop(it){if(!confirm("Remove “"+it.name+"” from the shelf?"))return;await tx("readwrite",s=>s.delete(it.id));
if(S.item&&S.item.id===it.id){pause(true);S.item=null;$("#slot").replaceChildren();info("No tape loaded")}refresh()}
$("#add").onclick=()=>{unlock();$("#pick").click()};
$("#rm").onclick=()=>{if(D.classList.toggle("rm"))toast("Tap a tape to remove it")};
$("#pick").onchange=async e=>{const fs=[...e.target.files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(!fs.length)return;
const base=fs[0].name.replace(/\.[^.]+$/,""),name=(prompt("Name this tape",fs.length>1?"Mixtape":base)||"").trim()||base;
const t={id:Date.now(),name,tracks:fs.map(f=>({name:f.name.replace(/\.[^.]+$/,""),blob:f}))};
try{await tx("readwrite",s=>s.put(t));if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();toast("Tape added")}catch(err){toast("Couldn’t save. Your browser may be out of space.")}
e.target.value="";refresh()};
refresh();
</script></body></html>
